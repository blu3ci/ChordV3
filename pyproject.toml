[tool.poetry]
name = "chordv3"
version = "0.1.0"
description = "Discord music bot with many features"
authors = ["Anirudh <madadi.anirudh@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
flake8 = "^6.0.0"
black = "^23.3.0"
flake8-bugbear = "^23.6.5"
flake8-bandit = "^4.1.1"
flake8-builtins = "^2.1.0"
flake8-comprehensions = "^3.13.0"
flake8-eradicate = "^1.5.0"
flake8-implicit-str-concat = "^0.4.0"
flake8-print = "^5.0.0"
isort = "^5.12.0"
pep8-naming = "^0.13.3"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 120

[tool.isort]
profile = "black" 
